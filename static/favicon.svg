<?xml version="1.0" encoding="UTF-8"?>
<!-- LTV Analyzer — App favicon / logo (Variant B2)
     Layout: L(24,62) T(50,78) V(76,96), font-size 96, Cormorant Garamond Bold
     Colors: bg #000 (black) / L #2b6a94 (deep blue) / T #5ea1c7 (mid) / V #9ccce5 (light)
     To rasterize with authentic Cormorant Garamond, use realfavicongenerator.net
     or local tooling where Cormorant is installed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#000000"/>
  <g font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
     font-weight="700" text-anchor="middle">
    <text x="24" y="62" font-size="96" fill="#2b6a94">L</text>
    <text x="50" y="78" font-size="96" fill="#5ea1c7">T</text>
    <text x="76" y="96" font-size="96" fill="#9ccce5">V</text>
  </g>
</svg>
